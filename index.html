<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Twalix — Prototyp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root { --host-bg: #DDE3E6; --bar-bg: #16242C; --bar-ink: #E8EEF1; --bar-muted: #9FB0B9; --bar-line: #33454F; --bar-on: #0E5A7A; }
:root[data-host-theme="dark"] { --host-bg: #0B1216; }
* { -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; background: var(--host-bg); font-family: 'IBM Plex Sans', system-ui, sans-serif; }
#bar { flex: none; display: flex; align-items: center; gap: 8px 20px; padding: 8px 16px; background: var(--bar-bg); color: var(--bar-ink); font-size: 14px; overflow-x: auto; white-space: nowrap; }
#bar strong { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; margin-right: 4px; }
#bar .grp { display: inline-flex; align-items: center; gap: 8px; }
#bar .lbl { color: var(--bar-muted); }
#bar .seg { display: inline-flex; border: 1px solid var(--bar-line); border-radius: 8px; overflow: hidden; }
#bar button, #bar select { min-height: 36px; padding: 0 12px; border: 0; background: transparent; color: var(--bar-ink); font: inherit; font-weight: 600; cursor: pointer; }
#bar .seg button + button { border-left: 1px solid var(--bar-line); }
#bar .seg button[aria-pressed="true"] { background: var(--bar-on); color: #fff; }
#bar select { border: 1px solid var(--bar-line); border-radius: 8px; padding-right: 8px; }
#bar select option { color: #111; }
#bar #reset { margin-left: auto; border: 1px solid var(--bar-line); border-radius: 8px; }
#bar button:focus-visible, #bar select:focus-visible { outline: 2px solid #7CC4E4; outline-offset: -2px; }
#stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; overflow: hidden; }
#box { flex: none; }
#device { transform-origin: 0 0; overflow: hidden; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.18), 0 18px 50px rgba(0,0,0,.22); }
body.bare #stage { padding: 0; }
body.bare #device { box-shadow: none; }
body.bare #bar .only-wide { display: none; }
</style>
</head>
<body>
<div id="bar">
  <strong>Twalix</strong>
  <span class="grp only-wide"><span class="lbl">Gerät</span>
    <span class="seg" data-prop="layout"><button type="button" data-val="tablet">Tablet</button><button type="button" data-val="phone">Telefon</button></span>
  </span>
  <span class="grp"><span class="lbl">Thema</span>
    <span class="seg" data-prop="theme"><button type="button" data-val="light">Hell</button><button type="button" data-val="dark">Dunkel</button></span>
  </span>
  <label class="grp"><span class="lbl">Bereich</span>
    <select id="area">
      <option value="projects">App</option>
      <option value="auth">Anmeldung</option>
      <option value="admin">Verwaltung</option>
    </select>
  </label>
  <label class="grp"><span class="lbl">Szenario</span>
    <select id="scenario">
      <option value="">Normal</option>
      <option value="expired">Lizenz abgelaufen</option>
      <option value="full">Keine freien Plätze</option>
    </select>
  </label>
  <button type="button" id="reset">Neu starten</button>
</div>
<div id="stage"><div id="box"><div id="device"></div></div></div>

<template id="tpl">
<div style="width: 100%; height: 100%; overflow: hidden">
<div style="{{themeStyle}}">

<sc-if value="{{ro}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; top: 0; left: 0; right: 0; height: 44px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; justify-content: center; background: var(--warnBg); color: var(--warnInk); font-size: 15px; font-weight: 600; text-align: center">{{s.licence}}</div>
</sc-if>

<sc-if value="{{isProjects}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; top: {{top}}px; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column">
  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px {{pad}}px; background: var(--surface); border-bottom: 1px solid var(--line)">
    <div style="font-size: 26px; font-weight: 700; letter-spacing: -0.02em">Twalix</div>
    <button onClick="{{syncNow}}" style="margin-right: auto; min-height: 46px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--muted); font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">{{syncLabel}}</button>
    <button aria-label="{{s.account}}" onClick="{{goSettings}}" style="width: 52px; height: 52px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4.5 4-6.5 8-6.5s7 2 8 6.5"></path></svg>
    </button>
    <input aria-label="{{s.search}}" placeholder="{{s.search}}" value="{{q}}" onChange="{{onQ}}" style="flex: 1 1 220px; max-width: 420px; min-height: 52px; padding: 0 16px; box-sizing: border-box; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font-family: inherit; font-size: 18px">
    <button disabled="{{ro}}" onClick="{{openNew}}" style="min-height: 52px; padding: 0 22px; border: 0; border-radius: 10px; background: var(--pri); color: var(--priText); font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer; opacity: {{roOpacity}}">+ {{s.newProject}}</button>
  </header>
  <div style="flex: 1; min-height: 0; overflow: auto; padding: 20px {{pad}}px; display: flex; flex-direction: column; gap: 10px">
    <h1 style="margin: 0 0 6px; font-size: 15px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted)">{{s.projects}}</h1>
    <sc-for list="{{projects}}" as="p" hint-placeholder-count="4">
      <button onClick="{{p.open}}" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; width: 100%; min-height: 72px; padding: 14px 18px; box-sizing: border-box; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); font-family: inherit; font-size: 18px; text-align: left; cursor: pointer">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 500; color: var(--pri); min-width: 96px">{{p.num}}</span>
        <span style="flex: 1 1 200px; font-weight: 600">{{p.name}}</span>
        <span style="font-size: 15px; color: var(--muted)">{{p.changed}}</span>
        <span style="min-width: 96px; text-align: right; font-weight: 600">{{p.countLabel}}</span>
      </button>
    </sc-for>
    <sc-if value="{{noProjects}}" hint-placeholder-val="{{ false }}">
      <p style="margin: 24px 0; color: var(--muted)">{{s.noProjects}}</p>
    </sc-if>
  </div>
</div>
</sc-if>

<sc-if value="{{isProject}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; top: {{top}}px; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column">
  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px {{pad}}px; background: var(--surface); border-bottom: 1px solid var(--line)">
    <button aria-label="{{s.back}}" onClick="{{goProjects}}" style="width: 52px; height: 52px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <div style="flex: 1 1 200px; min-width: 0">
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--pri)">{{cur.num}}</div>
      <div style="font-size: 21px; font-weight: 700; letter-spacing: -0.01em">{{cur.name}}</div>
    </div>
    <button aria-label="{{s.editProject}}" disabled="{{ro}}" onClick="{{openEdit}}" style="width: 52px; height: 52px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; opacity: {{roOpacity}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>
    </button>
    <button onClick="{{openExport}}" style="min-height: 52px; padding: 0 20px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer">{{s.exportBtn}}</button>
    <button disabled="{{ro}}" onClick="{{startSample}}" style="min-height: 52px; padding: 0 22px; border: 0; border-radius: 10px; background: var(--acc); color: var(--accText); font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer; opacity: {{roOpacity}}">+ {{s.newSample}}</button>
  </header>
  <div style="display: flex; gap: 8px; padding: 12px {{pad}}px 0">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
      <button aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="min-height: 46px; padding: 0 18px; border: 1.5px solid {{t.bd}}; border-radius: 999px; background: {{t.bg}}; color: {{t.fg}}; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer">{{t.label}}</button>
    </sc-for>
  </div>
  <div style="flex: 1; min-height: 0; overflow: auto; padding: 16px {{pad}}px 24px">

    <sc-if value="{{tabSamples}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{samples}}" as="x" hint-placeholder-count="3">
          <button onClick="{{x.open}}" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; width: 100%; min-height: 68px; padding: 12px 18px; box-sizing: border-box; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); font-family: inherit; font-size: 17px; text-align: left; cursor: pointer">
            <span style="font-weight: 700; min-width: 110px">{{x.room}}</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 500; min-width: 150px">{{x.num}}</span>
            <span style="font-size: 15px; font-weight: 600; min-width: 100px">{{x.kind}}</span>
            <span style="flex: 1 1 160px; color: var(--muted)">{{x.analytes}}</span>
            <span style="font-size: 15px; color: var(--muted)">{{x.meta}}</span>
            <span style="font-size: 15px; color: var(--muted)">{{x.time}}</span>
          </button>
        </sc-for>
        <sc-if value="{{noSamples}}" hint-placeholder-val="{{ false }}">
          <p style="margin: 24px 0; color: var(--muted)">{{s.noSamples}}</p>
        </sc-if>
      </div>
    </sc-if>

    <sc-if value="{{tabTable}}" hint-placeholder-val="{{ false }}">
      <div style="overflow-x: auto; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface)">
        <div style="min-width: 900px">
          <div style="display: grid; grid-template-columns: 1.1fr 1.4fr 1.1fr 1.6fr 1.4fr 80px 80px; gap: 12px; padding: 12px 16px; background: var(--surface2); font-size: 14px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted)">
            <div>{{s.thRoom}}</div><div>{{s.thNum}}</div><div>{{s.thKind}}</div><div>{{s.thAnalysis}}</div><div>{{s.thDate}}</div><div>{{s.thPhotos}}</div><div>{{s.thPlan}}</div>
          </div>
          <sc-for list="{{samples}}" as="x" hint-placeholder-count="3">
            <div style="display: grid; grid-template-columns: 1.1fr 1.4fr 1.1fr 1.6fr 1.4fr 80px 80px; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--line); font-size: 16px; align-items: center">
              <div style="font-weight: 600">{{x.room}}</div>
              <div style="font-family: 'IBM Plex Mono', monospace; font-size: 15px">{{x.num}}</div>
              <div>{{x.kind}}</div>
              <div>{{x.analytes}}</div>
              <div style="color: var(--muted)">{{x.time}}</div>
              <div>{{x.photoCount}}</div>
              <div>{{x.planMark}}</div>
            </div>
          </sc-for>
        </div>
      </div>
      <sc-if value="{{noSamples}}" hint-placeholder-val="{{ false }}">
        <p style="margin: 24px 0; color: var(--muted)">{{s.noSamples}}</p>
      </sc-if>
    </sc-if>

    <sc-if value="{{tabPlans}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{planRows}}" as="pl" hint-placeholder-count="2">
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px 18px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface)">
            <sc-if value="{{pl.editing}}" hint-placeholder-val="{{ false }}">
              <input aria-label="{{s.rename}}" value="{{renameVal}}" onChange="{{onRename}}" onKeyDown="{{onRenameKey}}" style="flex: 1 1 220px; min-height: 48px; padding: 0 14px; box-sizing: border-box; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font-family: inherit; font-size: 17px">
              <button onClick="{{saveRename}}" style="min-height: 48px; padding: 0 20px; border: 0; border-radius: 10px; background: var(--pri); color: var(--priText); font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer">{{s.ok}}</button>
            </sc-if>
            <sc-if value="{{pl.idle}}" hint-placeholder-val="{{ true }}">
              <button onClick="{{pl.open}}" style="flex: 1 1 220px; min-height: 48px; padding: 0; border: 0; background: transparent; color: var(--ink); font-family: inherit; font-size: 18px; font-weight: 600; text-align: left; text-decoration: underline; text-underline-offset: 4px; cursor: pointer">{{pl.name}}</button>
              <div style="color: var(--muted); font-size: 15px">{{pl.countLabel}}</div>
              <button onClick="{{pl.rename}}" style="min-height: 46px; padding: 0 16px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer">{{s.rename}}</button>
              <button onClick="{{replacePlan}}" style="min-height: 46px; padding: 0 16px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer">{{s.replace}}</button>
            </sc-if>
          </div>
        </sc-for>
        <button disabled="{{ro}}" onClick="{{addPlan}}" style="align-self: flex-start; min-height: 52px; padding: 0 20px; border: 1.5px dashed var(--line); border-radius: 10px; background: transparent; color: var(--ink); font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer; opacity: {{roOpacity}}">+ {{s.addPdf}}</button>
      </div>
    </sc-if>

  </div>
</div>
</sc-if>

<sc-if value="{{isWizard}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; top: {{top}}px; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 12px; padding: 12px {{pad}}px; background: var(--surface); border-bottom: 1px solid var(--line)">
    <button aria-label="{{s.cancel}}" onClick="{{closeWizard}}" style="flex: none; width: 52px; height: 52px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
    <div style="flex: 1; min-width: 0">
      <div style="font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{cur.num}} · {{cur.name}}</div>
      <div style="font-size: 19px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ctx}}</div>
    </div>
  </header>
  <div style="display: flex; gap: 6px; padding: 10px {{pad}}px; background: var(--surface); border-bottom: 1px solid var(--line)">
    <sc-for list="{{steps}}" as="sp" hint-placeholder-count="5">
      <button aria-pressed="{{sp.on}}" aria-label="{{sp.label}}" onClick="{{sp.go}}" style="flex: 1 1 0; min-width: 0; min-height: 46px; padding: 0 8px; border: 0; border-radius: 10px; background: {{sp.bg}}; color: {{sp.fg}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px">
        <span>{{sp.n}}</span><span style="display: {{stepLabelDisplay}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{sp.label}}</span>
      </button>
    </sc-for>
  </div>

  <div style="flex: 1; min-height: 0; overflow: auto; padding: 20px {{pad}}px">

    <sc-if value="{{s1}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 22px; max-width: 720px">
        <label style="display: flex; flex-direction: column; gap: 8px; font-size: 16px; font-weight: 600">{{s.room}}
          <input placeholder="{{s.roomPh}}" value="{{d.room}}" onChange="{{onRoom}}" style="min-height: 56px; padding: 0 16px; box-sizing: border-box; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font-family: inherit; font-size: 20px">
        </label>
        <sc-if value="{{hasRooms}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <div style="font-size: 14px; color: var(--muted)">{{s.recent}}</div>
            <div style="display: flex; flex-wrap: wrap; gap: 8px">
              <sc-for list="{{rooms}}" as="r" hint-placeholder-count="3">
                <button onClick="{{r.pick}}" style="min-height: 46px; padding: 0 18px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer">{{r.label}}</button>
              </sc-for>
            </div>
          </div>
        </sc-if>
        <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px">
          <label style="flex: 1 1 240px; display: flex; flex-direction: column; gap: 8px; font-size: 16px; font-weight: 600">{{s.sampleNo}}
            <input value="{{d.num}}" onChange="{{onNum}}" onKeyDown="{{onNumKey}}" autocapitalize="characters" style="min-height: 56px; padding: 0 16px; box-sizing: border-box; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font-family: 'IBM Plex Mono', monospace; font-size: 20px">
          </label>
          <button onClick="{{scan}}" style="min-height: 56px; padding: 0 20px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 10px">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3M8 9v6M12 9v6M16 9v6"></path></svg>
            {{s.scan}}
          </button>
        </div>
        <sc-if value="{{dup}}" hint-placeholder-val="{{ false }}">
          <div style="padding: 12px 16px; border-radius: 10px; background: var(--warnBg); color: var(--warnInk); font-size: 16px; font-weight: 500">{{s.dupWarn}}</div>
        </sc-if>
        <div role="group" aria-label="{{s.kind}}" style="display: flex; flex-direction: column; gap: 8px">
          <div style="font-size: 16px; font-weight: 600">{{s.kind}}</div>
          <div style="display: flex; flex-wrap: wrap; gap: 10px">
            <sc-for list="{{kinds}}" as="k" hint-placeholder-count="2">
              <button aria-pressed="{{k.on}}" onClick="{{k.pick}}" style="flex: 1 1 200px; min-height: 64px; padding: 8px 20px; border: 1.5px solid {{k.bd}}; border-radius: 10px; background: {{k.bg}}; color: {{k.fg}}; font-family: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column; justify-content: center; gap: 2px">
                <span style="font-size: 18px; font-weight: 600">{{k.label}}</span>
                <span style="font-size: 14px; font-weight: 400; opacity: 0.85">{{k.hint}}</span>
              </button>
            </sc-for>
          </div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{s2}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 18px">
        <div style="font-size: 16px; font-weight: 600">{{s.analyseFor}}</div>
        <div style="display: flex; flex-wrap: wrap; gap: 10px">
          <sc-for list="{{analytes}}" as="a" hint-placeholder-count="9">
            <button aria-pressed="{{a.on}}" onClick="{{a.toggle}}" style="min-height: 56px; min-width: 120px; padding: 0 22px; border: 1.5px solid {{a.bd}}; border-radius: 10px; background: {{a.bg}}; color: {{a.fg}}; font-family: inherit; font-size: 18px; font-weight: 600; cursor: pointer">{{a.label}}</button>
          </sc-for>
        </div>
        <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; max-width: 560px">
          <label style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; color: var(--muted)">{{s.customAnalyte}}
            <input value="{{custom}}" onChange="{{onCustom}}" onKeyDown="{{onCustomKey}}" style="min-height: 52px; padding: 0 16px; box-sizing: border-box; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font-family: inherit; font-size: 18px">
          </label>
          <button onClick="{{addCustom}}" style="min-height: 52px; padding: 0 20px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer">{{s.add}}</button>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{s3}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">

<script>
/* Minimal runtime for the prototype: {{holes}}, <sc-if>, <sc-for>, events, state. */
(function () {
  const WHOLE = /^\s*\{\{([^}]*)\}\}\s*$/;
  const UNITLESS = /^(lineHeight|opacity|zIndex|flex|flexGrow|flexShrink|fontWeight|order)$/;

  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    let v = scope;
    for (const p of path.split('.')) { if (v == null) return undefined; v = v[p]; }
    return v;
  }
  function interp(s, scope) {
    return s.replace(/\{\{([^}]*)\}\}/g, (m, p) => { const v = lookup(p, scope); return v == null || v === false || v === true ? '' : String(v); });
  }
  function styleText(o) {
    return Object.keys(o).map((k) => {
      let v = o[k];
      if (v == null || v === false) return '';
      const custom = k.indexOf('--') === 0;
      if (typeof v === 'number' && !custom && !UNITLESS.test(k)) v = v + 'px';
      return (custom ? k : k.replace(/[A-Z]/g, (c) => '-' + c.toLowerCase())) + ':' + v;
    }).filter(Boolean).join(';');
  }
  function attach(el) {
    if (!el.__ev) return;
    el.__ls = el.__ls || {};
    Object.keys(el.__ev).forEach((t) => {
      if (el.__ls[t]) return;
      el.__ls[t] = true;
      el.addEventListener(t, (e) => { const f = el.__ev && el.__ev[t]; if (f) f(e); });
    });
  }
  function build(node, scope, out) {
    if (node.nodeType === 3) { const t = document.createTextNode(interp(node.data, scope)); t.__k = node; out.appendChild(t); return; }
    if (node.nodeType !== 1) return;
    const ln = node.localName;
    if (ln === 'sc-if') {
      const m = WHOLE.exec(node.getAttribute('value') || '');
      if (m && lookup(m[1], scope)) node.childNodes.forEach((c) => build(c, scope, out));
      return;
    }
    if (ln === 'sc-for') {
      const m = WHOLE.exec(node.getAttribute('list') || '');
      const list = (m && lookup(m[1], scope)) || [];
      const as = node.getAttribute('as') || 'item';
      list.forEach((it, i) => {
        const sc = Object.create(scope); sc[as] = it; sc.$index = i;
        node.childNodes.forEach((c) => build(c, sc, out));
      });
      return;
    }
    const el = document.createElementNS(node.namespaceURI, ln);
    el.__k = node;
    for (const a of Array.from(node.attributes)) {
      const n = a.name;
      if (n.indexOf('hint-') === 0) continue;

      ? { on: true, bg: 'var(--pri)', fg: 'var(--priText)', bd: 'var(--pri)' }
      : { on: false, bg: 'var(--surface)', fg: 'var(--ink)', bd: 'var(--line)' });

    const themeStyle = Object.assign({
      position: 'relative', width: '100%', height: '100%', overflow: 'hidden', boxSizing: 'border-box',
      fontFamily: "'IBM Plex Sans', system-ui, sans-serif", fontSize: 17, lineHeight: 1.4,
      color: 'var(--ink)', background: 'var(--bg)'
    }, this.themeVars((P.theme ?? 'light') === 'dark'));

    const q = st.q.trim().toLowerCase();
    const projects = st.projects
      .filter((p) => !q || (p.num + ' ' + p.name).toLowerCase().indexOf(q) >= 0)
      .map((p) => ({ num: p.num, name: p.name, changed: p.changed, countLabel: p.samples.length + ' ' + s.unit,
        open: () => this.setState({ screen: 'project', pid: p.id, tab: 'samples' }) }));

    const planName = (id) => { const pl = cur && cur.plans.find((x) => x.id === id); return pl ? pl.name : ''; };
    const samples = (cur ? cur.samples : []).map((x) => ({
      room: x.room || '—', num: x.num || '—', kind: x.kind === 'mixed' ? s.kindMixed : s.kindSingle, analytes: x.analytes.join(', ') || '—', time: x.time,
      photoCount: String(x.photos.length), planMark: x.x != null ? s.yes : '—',
      meta: x.photos.length + ' ' + s.thPhotos + (x.x != null ? ' · ' + s.thPlan : ''),
      open: () => this.setState({ screen: 'wizard', step: 5, zoom: 1, confirmDel: false, draft: Object.assign({}, x, { prev: null }) })
    }));

    const tabs = [['samples', s.tabSamples], ['table', s.tabTable], ['plans', s.tabPlans]].map((t) =>
      Object.assign(chip(st.tab === t[0]), { label: t[1], pick: () => this.setState({ tab: t[0] }) }));

    const markCount = (id) => cur.samples.filter((x) => x.planId === id && x.x != null).length + ' ' + s.markers;
    const planRows = (cur ? cur.plans : []).map((pl) => ({ name: pl.name, countLabel: markCount(pl.id),
      editing: st.renameId === pl.id, idle: st.renameId !== pl.id,
      open: () => this.setState({ screen: 'plan', planView: pl.id, zoom: 1 }),
      rename: () => this.setState({ renameId: pl.id, renameVal: pl.name }) }));
    const saveRename = () => {
      const v = st.renameVal.trim();
      if (!cur || !v) { this.setState({ renameId: null }); return; }
      this.setState({ renameId: null, projects: st.projects.map((p) => (p.id === cur.id
        ? Object.assign({}, p, { plans: p.plans.map((pl) => (pl.id === st.renameId ? Object.assign({}, pl, { name: v }) : pl)) }) : p)) });
    };
    const pvPlan = cur ? cur.plans.find((pl) => pl.id === st.planView) : null;

    const used = st.people.filter((p) => p.active).length;
    const free = st.org.seats - used;
    const ownerName = (id) => { const p = st.people.find((x) => x.id === id); return p ? p.name : ''; };
    const people = st.people.map((p) => ({
      name: p.name,
      sub: (p.role === 'admin' ? s.roleAdmin : s.roleMember) + ' · ' + st.devices.filter((x) => x.owner === p.id).length + ' ' + s.devicesWord + (p.active ? '' : ' · ' + s.inactive),
      canToggle: p.role !== 'admin', btnLabel: p.active ? s.deactivate : s.activate, btnFg: p.active ? 'var(--danger)' : 'var(--ink)',
      toggle: () => {
        if (!p.active && free <= 0) { this.flash(s.toastNoSeat); return; }
        this.setState({ people: st.people.map((x) => (x.id === p.id ? Object.assign({}, x, { active: !x.active }) : x)) });
      }
    }));
    const devices = st.devices.map((dv) => ({ name: dv.name, sub: ownerName(dv.owner) + ' · ' + s.lastSync + ' ' + dv.last,
      remove: () => this.setState({ devices: st.devices.filter((x) => x.id !== dv.id) }) }));
    const myDevices = st.devices.filter((x) => x.owner === 'u1').length;
    const register = st.authMode === 'register';
    const connect = () => {
      if (!st.code.trim()) { this.setState({ authErr: 'auCodeErr' }); return; }
      if (P.seatsFull) { this.setState({ authErr: 'auFull' }); return; }
      this.setState({ authStep: 2, authErr: '' });
    };
    const authSubmit = () => {
      if (!st.email.trim() || !st.pw) { this.setState({ authErr: 'auFieldErr' }); return; }
      this.setState({ authStep: 3, authErr: '' });
    };
    const langs = [['de', 'Deutsch'], ['en', 'English'], ['fr', 'Français'], ['es', 'Español']].map((l) =>
      Object.assign(chip(lang === l[0]), { label: l[1],
        pick: () => { if (l[0] === 'de' || l[0] === 'en') this.setState({ lang: l[0] }); else this.flash(s.toastLang); } }));
    const rnd = () => Math.random().toString(36).slice(2, 6).toUpperCase().padEnd(4, 'X');

    const roomSet = [];
    (cur ? cur.samples : []).forEach((x) => { if (x.room && roomSet.indexOf(x.room) < 0) roomSet.push(x.room); });
    const rooms = roomSet.slice(-6).map((r) => ({ label: r, pick: () => this.patchDraft({ room: r }) }));

    const steps = [s.st1, s.st2, s.st3, s.st4, s.st5].map((label, i) => {
      const n = i + 1, on = st.step === n, done = n < st.step;
      return { n: String(n), label: label, on: on,
        bg: on ? 'var(--pri)' : done ? 'var(--sel)' : 'var(--surface2)',
        fg: on ? 'var(--priText)' : done ? 'var(--ink)' : 'var(--muted)',
        go: () => this.setState({ step: n, confirmDel: false }) };
    });

    const dKind = d.kind === 'mixed' ? 'mixed' : 'single';
    const kinds = [['single', s.kindSingle, s.kindSingleHint], ['mixed', s.kindMixed, s.kindMixedHint]].map((k) =>
      Object.assign(chip(dKind === k[0]), { label: k[1], hint: k[2], pick: () => this.patchDraft({ kind: k[0] }) }));

    const analytes = st.analytes.map((a) => Object.assign(chip(d.analytes.indexOf(a) >= 0), { label: a,
      toggle: () => this.patchDraft({ analytes: d.analytes.indexOf(a) >= 0 ? d.analytes.filter((x) => x !== a) : d.analytes.concat([a]) }) }));

    const planChips = (cur ? cur.plans : []).map((pl) => Object.assign(chip(d.planId === pl.id), { name: pl.name,
      pick: () => this.patchDraft({ planId: pl.id, x: null, y: null, prev: null }) }));

    const pct = (v) => (v * 100).toFixed(2) + '%';
    const markers = (cur ? cur.samples : [])
      .filter((x) => x.planId === d.planId && x.id !== d.id && x.x != null)
      .map((x) => ({ left: pct(x.x), top: pct(x.y), label: x.num || '—' }));
    const hasDraftMarker = d.x != null;

    const photoIdx = d.photos.findIndex((x) => x.id === st.photoId);
    const photoTitle = photoIdx >= 0 ? s.photo + ' ' + (photoIdx + 1) + ' · ' + d.photos[photoIdx].time : '';
    const exFiles = [];
    if (cur && st.ex.plan) cur.plans.forEach((pl) => exFiles.push({ name: cur.num + '_' + pl.name }));
    if (cur && st.ex.xlsx) exFiles.push({ name: cur.num + '_' + s.exFileList + '.xlsx' });
    if (cur && st.ex.csv) exFiles.push({ name: cur.num + '_' + s.exFileList + '.csv' });
    if (cur && st.ex.report) exFiles.push({ name: cur.num + '_' + s.exFileReport + '.pdf' });
    const photos = d.photos.map((ph, i) => ({ label: s.photo + ' ' + (i + 1) + ' · ' + ph.time,
      open: () => this.setState({ screen: 'photo', photoId: ph.id }),
      remove: () => this.patchDraft({ photos: d.photos.filter((x) => x.id !== ph.id) }) }));

    const goStep = (n) => () => this.setState({ step: n });
    const review = [
      { label: s.rvRoom, value: d.room || '—', go: goStep(1) },
      { label: s.rvNum, value: d.num || '—', go: goStep(1) },
      { label: s.kind, value: dKind === 'mixed' ? s.kindMixed : s.kindSingle, go: goStep(1) },
      { label: s.rvAnalysis, value: d.analytes.join(', ') || '—', go: goStep(2) },
      { label: s.rvPlan, value: d.planId ? planName(d.planId) + ' · ' + (hasDraftMarker ? s.marked : s.noMarker) : '—', go: goStep(3) },
      { label: s.rvPhotos, value: String(d.photos.length), go: goStep(4) }
    ];

    const dup = !!(cur && d.num && cur.samples.some((x) => x.num === d.num && x.id !== d.id));
    const ctxParts = [];
    if (d.room) ctxParts.push(d.room);
    if (d.num) ctxParts.push(s.sample0 + ' ' + d.num);
    const addPhoto = () => {
      const t = this.now().split(', ')[1];
      this.setState({ seq: st.seq + 1, draft: Object.assign({}, d, { photos: d.photos.concat([{ id: 'f' + st.seq, time: t }]) }) });
    };
    const addCustom = () => {
      const v = st.custom.trim();
      if (!v) return;
      const list = st.analytes.indexOf(v) >= 0 ? st.analytes : st.analytes.concat([v]);
      this.setState({ analytes: list, custom: '', draft: Object.assign({}, d, { analytes: d.analytes.indexOf(v) >= 0 ? d.analytes : d.analytes.concat([v]) }) });
    };
    const next = () => this.setState({ step: Math.min(5, st.step + 1) });
    const zooms = [1, 1.5, 2, 3, 4];
    const zi = Math.max(0, zooms.indexOf(st.zoom));
    const setEx = (patch) => this.setState({ ex: Object.assign({}, st.ex, patch) });

    return {
      w: phone ? 390 : 1180, h: phone ? 844 : 820, pad: phone ? 16 : 28, top: ro ? 44 : 0,
      viewH: phone ? 330 : 410, stepLabelDisplay: phone ? 'none' : 'inline',
      themeStyle: themeStyle, s: s, ro: ro, roOpacity: ro ? 0.45 : 1,
      isProjects: screen === 'projects', isProject: screen === 'project' && !!cur, isWizard: screen === 'wizard' && !!cur,
      isPlan: screen === 'plan' && !!pvPlan, isAuth: screen === 'auth', isSettings: screen === 'settings', isAdmin: screen === 'admin',
      syncLabel: st.pending > 0 ? st.pending + ' ' + s.pendingSuffix : s.synced,
      syncNow: () => { this.setState({ pending: 0 }); this.flash(s.synced); },
      goSettings: () => this.setState({ screen: 'settings' }),
      goAdmin: () => this.setState({ screen: 'admin' }),
      logout: () => this.setState({ screen: 'auth', authStep: 1, authMode: 'login', authErr: '', code: '', pw: '' }),
      renameVal: st.renameVal, onRename: (e) => this.setState({ renameVal: e.target.value }),
      onRenameKey: (e) => { if (e.key === 'Enter') saveRename(); }, saveRename: saveRename,
      replacePlan: () => this.flash(s.toastReplaced),
      pv: pvPlan ? { name: pvPlan.name, countLabel: markCount(pvPlan.id) } : { name: '', countLabel: '' },
      pvMarkers: (cur && pvPlan ? cur.samples : []).filter((x) => x.planId === pvPlan.id && x.x != null)
        .map((x) => ({ left: (x.x * 100).toFixed(2) + '%', top: (x.y * 100).toFixed(2) + '%', label: x.num || '—' })),
      closePlan: () => this.setState({ screen: 'project', tab: 'plans', zoom: 1 }),
      a1: st.authStep === 1, a2: st.authStep === 2, a3: st.authStep === 3,
      a4: st.authStep === 4, a5: st.authStep === 5,
      authStepLabel: st.authStep <= 3 ? s.auStep + ' ' + st.authStep + ' ' + s.of + ' 3' : '',
      goForgot: () => this.setState({ authStep: 4, authErr: '' }),
      sendReset: () => this.setState(st.email.trim() ? { authStep: 5, authErr: '' } : { authErr: 'fgErr' }),
      backToLogin: () => this.setState({ authStep: 2, authMode: 'login', authErr: '' }),
      isScan: screen === 'scan' && !!cur && !!st.draft, isPhoto: screen === 'photo' && !!cur && photoIdx >= 0,
      scanClose: () => this.setState({ screen: 'wizard' }),
      scanDetect: () => this.setState({ screen: 'wizard', seq: st.seq + 1, draft: Object.assign({}, d, { num: 'IGN5128' + String(st.seq).slice(-2) + 'INS' }) }),
      photoTitle: photoTitle, closePhoto: () => this.setState({ screen: 'wizard' }),
      removePhoto: () => this.setState({ screen: 'wizard', draft: Object.assign({}, d, { photos: d.photos.filter((x) => x.id !== st.photoId) }) }),
      projDlgTitle: st.editPid ? s.editProject : s.newProject, projDlgAction: st.editPid ? s.save : s.create,
      openEdit: () => { if (cur) this.setState({ showNew: true, editPid: cur.id, newNum: cur.num, newName: cur.name, confirmProjDel: false }); },
      canProjDel: !!st.editPid && !st.confirmProjDel, confirmProjDel: !!st.editPid && st.confirmProjDel,
      askProjDel: () => this.setState({ confirmProjDel: true }),
      doProjDel: () => this.setState({ projects: st.projects.filter((p) => p.id !== st.editPid), showNew: false, editPid: null, confirmProjDel: false, screen: 'projects', pid: null, pending: st.pending + 1 }),
      exportDone: st.exportDone && !!cur, exFiles: exFiles, closeDone: () => this.setState({ exportDone: false }),
      code: st.code, onCode: (e) => this.setState({ code: e.target.value.toUpperCase(), authErr: '' }),
      onCodeKey: (e) => { if (e.key === 'Enter') connect(); }, connect: connect,
      hasAuthErr: !!st.authErr, authErr: st.authErr ? s[st.authErr] : '',
      isRegister: register, isLogin: !register,
      authTitle: register ? s.auRegister : s.auLogin, authToggle: register ? s.auToLogin : s.auToRegister,
      toggleAuthMode: () => this.setState({ authMode: register ? 'login' : 'register', authErr: '' }),
      orgLine: st.org.name + ' · ' + s.seatsFree + ': ' + Math.max(0, free),
      fullName: st.fullName, email: st.email, pw: st.pw,
      onFullName: (e) => this.setState({ fullName: e.target.value }),
      onEmail: (e) => this.setState({ email: e.target.value, authErr: '' }),
      onPw: (e) => this.setState({ pw: e.target.value, authErr: '' }),
      onPwKey: (e) => { if (e.key === 'Enter') authSubmit(); }, authSubmit: authSubmit,
      doneRows: [
        { label: s.setOrg, value: st.org.name },
        { label: s.auDevice, value: phone ? 'iPhone' : 'iPad Feld 3' },
        { label: s.auDevices, value: myDevices + ' ' + s.of + ' 2' },
        { label: s.validUntil, value: st.org.validUntil }
      ],
      accountRows: [
        { label: s.setName, value: 'Erika Mustermann' },
        { label: s.setOrg, value: st.org.name },
        { label: s.setRole, value: s.roleAdmin },
        { label: s.auDevice, value: phone ? 'iPhone' : 'iPad Feld 3' },
        { label: s.validUntil, value: st.org.validUntil }
      ],
      langs: langs, org: st.org, people: people, devices: devices,
      licenceLine: (ro ? s.adExpired : s.adActiveUntil) + ' ' + st.org.validUntil,
      seatsLine: used + ' ' + s.of + ' ' + st.org.seats + ' ' + s.adSeats + ' · ' + s.adPerUser,
      seatBar: Math.min(100, Math.round((used / st.org.seats) * 100)) + '%',
      regenCode: () => this.setState({ org: Object.assign({}, st.org, { code: 'TWX-' + rnd() + '-' + rnd() }) }),
      cur: cur || { num: '', name: '' },
      q: st.q, onQ: (e) => this.setState({ q: e.target.value }),
      projects: projects, noProjects: projects.length === 0,
      openNew: () => this.setState({ showNew: true, editPid: null, confirmProjDel: false, newNum: '', newName: '' }),
      closeNew: () => this.setState({ showNew: false, editPid: null, confirmProjDel: false }),
      showNew: st.showNew, newNum: st.newNum, newName: st.newName,
      onNewNum: (e) => this.setState({ newNum: e.target.value }),
      onNewName: (e) => this.setState({ newName: e.target.value }),
      createProject: () => {
        if (!st.newNum.trim() && !st.newName.trim()) return;
        if (st.editPid) {
          this.setState({ showNew: false, editPid: null, confirmProjDel: false, pending: st.pending + 1,
            projects: st.projects.map((p) => (p.id === st.editPid ? Object.assign({}, p, { num: st.newNum.trim() || '—', name: st.newName.trim() || '—', changed: this.now() }) : p)) });
          return;
        }
        const id = 'p' + st.seq;
        const p = { id: id, num: st.newNum.trim() || '—', name: st.newName.trim() || '—', changed: this.now(), plans: [], samples: [] };
        this.setState({ projects: [p].concat(st.projects), seq: st.seq + 1, showNew: false, screen: 'project', pid: id, tab: 'samples' });
      },
      goProjects: () => this.setState({ screen: 'projects' }),
      tabs: tabs, tabSamples: st.tab === 'samples', tabTable: st.tab === 'table', tabPlans: st.tab === 'plans',
      samples: samples, noSamples: samples.length === 0, planRows: planRows,
      demo: () => this.flash(s.toastDemo),
      addPlan: () => {
        if (!cur) return;
        const id = 'pl' + st.seq, plan = { id: id, name: 'Plan ' + (cur.plans.length + 1) + '.pdf' };
        const projects2 = st.projects.map((p) => (p.id === cur.id ? Object.assign({}, p, { plans: p.plans.concat([plan]) }) : p));
        const patch = { projects: projects2, seq: st.seq + 1 };
        if (st.draft) patch.draft = Object.assign({}, st.draft, { planId: id, x: null, y: null, prev: null });
        this.setState(patch);
      },
      startSample: () => {
        if (!cur) return;
        const last = cur.samples[cur.samples.length - 1];
        this.setState({ screen: 'wizard', step: 1, zoom: 1, confirmDel: false, draft: this.blankDraft(cur, last ? last.room : '') });
      },
      closeWizard: () => this.setState({ screen: 'project', draft: null, confirmDel: false }),
      ctx: ctxParts.join(' · ') || (d.id ? s.editSample : s.newSample),
      steps: steps, s1: st.step === 1, s2: st.step === 2, s3: st.step === 3, s4: st.step === 4, s5: st.step === 5, notLast: st.step < 5,
      d: d, rooms: rooms, hasRooms: rooms.length > 0, dup: dup, kinds: kinds,
      onRoom: (e) => this.patchDraft({ room: e.target.value }),
      onNum: (e) => this.patchDraft({ num: e.target.value.toUpperCase() }),
      onNumKey: (e) => { if (e.key === 'Enter') next(); },
      scan: () => this.setState({ screen: 'scan' }),
      analytes: analytes, custom: st.custom,
      onCustom: (e) => this.setState({ custom: e.target.value }),
      onCustomKey: (e) => { if (e.key === 'Enter') addCustom(); },
      addCustom: addCustom,
      planChips: planChips, markers: markers, hasDraftMarker: hasDraftMarker,
      dm: { left: hasDraftMarker ? pct(d.x) : '0%', top: hasDraftMarker ? pct(d.y) : '0%', label: d.num || s.newSample },
      planW: (st.zoom * 100) + '%', zoomLabel: Math.round(st.zoom * 100) + '%',
      zoomIn: () => this.setState({ zoom: zooms[Math.min(zooms.length - 1, zi + 1)] }),
      zoomOut: () => this.setState({ zoom: zooms[Math.max(0, zi - 1)] }),
      placeMarker: (e) => {
        if (!d.planId) { this.flash(s.addPdf); return; }
        const r = e.currentTarget.getBoundingClientRect();
        if (!r.width || !r.height) return;
        const x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
        const y = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
        this.patchDraft({ x: x, y: y, prev: { x: d.x, y: d.y } });
      },
      undoMarker: () => this.patchDraft(d.prev ? { x: d.prev.x, y: d.prev.y, prev: null } : { x: null, y: null }),
      photos: photos, noPhotos: photos.length === 0, takePhoto: addPhoto,
      review: review, timeLine: s.created + ': ' + (d.time || ''),
      onDesc: (e) => this.patchDraft({ desc: e.target.value }),
      canDelete: !!d.id && !st.confirmDel && !ro, confirmDel: st.confirmDel,
      askDelete: () => this.setState({ confirmDel: true }),
      cancelDelete: () => this.setState({ confirmDel: false }),
      doDelete: () => {
        const projects2 = st.projects.map((p) => (p.id === st.pid ? Object.assign({}, p, { samples: p.samples.filter((x) => x.id !== d.id), changed: this.now() }) : p));
        this.setState({ projects: projects2, screen: 'project', draft: null, confirmDel: false, pending: st.pending + 1 });
      },
      next: next, save: () => this.commit(false), saveNext: () => this.commit(true),
      showExport: st.showExport,
      ex: { plan: st.ex.plan, annot: st.ex.mode === 'annot', flat: st.ex.mode === 'flat', xlsx: st.ex.xlsx, csv: st.ex.csv, report: st.ex.report },
      openExport: () => this.setState({ showExport: true }),
      closeExport: () => this.setState({ showExport: false }),
      togPlan: () => setEx({ plan: !st.ex.plan }), togXlsx: () => setEx({ xlsx: !st.ex.xlsx }),
      togCsv: () => setEx({ csv: !st.ex.csv }), togReport: () => setEx({ report: !st.ex.report }),
      setAnnot: () => setEx({ mode: 'annot' }), setFlat: () => setEx({ mode: 'flat' }),
      doExport: () => this.setState({ showExport: false, exportDone: true }),
      hasToast: !!st.toast, toast: st.toast
    };
  }
}
</script>

<script>
(function () {
  const SIZES = { tablet: [1180, 820], phone: [390, 844] };
  const device = document.getElementById('device'), box = document.getElementById('box'), stage = document.getElementById('stage');
  const tpl = document.getElementById('tpl');
  const narrow = window.matchMedia('(max-width: 600px)');
  const ui = { layout: 'tablet', theme: 'light', area: 'projects', scenario: '' };
  let comp = null;

  function props() {
    return { layout: narrow.matches ? 'phone' : ui.layout, theme: ui.theme, lang: 'de', start: ui.area,
      licenseExpired: ui.scenario === 'expired', seatsFull: ui.scenario === 'full' };
  }
  function fit() {
    const p = props(), bare = narrow.matches;
    document.body.classList.toggle('bare', bare);
    document.documentElement.setAttribute('data-host-theme', ui.theme);
    if (bare) {
      box.style.width = stage.clientWidth + 'px'; box.style.height = stage.clientHeight + 'px';
      device.style.width = '100%'; device.style.height = '100%'; device.style.transform = ''; device.style.borderRadius = '0';
      return;
    }
    const s = SIZES[p.layout], pad = 40;
    const k = Math.min(1, (stage.clientWidth - pad) / s[0], (stage.clientHeight - pad) / s[1]);
    box.style.width = s[0] * k + 'px'; box.style.height = s[1] * k + 'px';
    device.style.width = s[0] + 'px'; device.style.height = s[1] + 'px';
    device.style.transform = 'scale(' + k + ')';
    device.style.borderRadius = (p.layout === 'phone' ? 28 : 18) + 'px';
  }
  function sync() {
    document.querySelectorAll('#bar .seg').forEach((seg) => {
      seg.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(ui[seg.dataset.prop] === b.dataset.val)));
    });
  }
  function start() { unmountDC(comp); fit(); comp = mountDC(Component, tpl, device, props()); }
  function update() { fit(); comp.props = props(); comp.forceUpdate(); }

  document.querySelectorAll('#bar .seg button').forEach((b) => b.addEventListener('click', () => {
    ui[b.parentNode.dataset.prop] = b.dataset.val; sync(); update();
  }));
  document.getElementById('area').addEventListener('change', (e) => { ui.area = e.target.value; start(); });
  document.getElementById('scenario').addEventListener('change', (e) => { ui.scenario = e.target.value; start(); });
  document.getElementById('reset').addEventListener('click', start);
  window.addEventListener('resize', update);
  narrow.addEventListener('change', update);

  sync(); start();
})();
</script>
</body>
</html>
